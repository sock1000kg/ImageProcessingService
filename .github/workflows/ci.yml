name: ci

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      engine: ${{ steps.filter.outputs.engine }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # Only paths that affect the build or checks. Excludes web/docs and everything else in engine/ (docs, README).
          filters: |
            web:
              - 'web/*'
              - 'web/!(docs)/**'
              - 'infra/docker-compose.yaml'
              - 'infra/app/minio/**'
              - 'infra/app/nats/**'
              - '.github/workflows/ci.yml'
            engine:
              - 'engine/src/**'
              - 'engine/models/**'
              - 'engine/tests/**'
              - 'engine/Dockerfile'
              - 'engine/requirements.txt'
              - 'engine/ruff.toml'
              - '.github/workflows/ci.yml'

  web:
    name: web (lint, test, build)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (type check)
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  web-integration:
    name: web (service tests on real Postgres, MinIO, NATS)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    env:
      # The values docker-compose.yaml needs. They match the web's built-in local defaults (config.ts), so the tests
      # connect to the stack without any extra settings. Throwaway credentials for a runner that is deleted afterwards.
      POSTGRES_PASSWORD: CHANGE_ME_imgproc_local
      MINIO_ROOT_USER: imgproclocal
      MINIO_ROOT_PASSWORD: CHANGE_ME_minio_local
      DATABASE_URL: postgresql://imgproc:CHANGE_ME_imgproc_local@localhost:5432/imgproc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The same compose file used for local development: waits until Postgres, NATS and MinIO are healthy.
      - name: Start Postgres, NATS and MinIO
        run: docker compose -f infra/docker-compose.yaml up -d --wait postgres nats minio

      # One-shot jobs that create the JetStream streams and the buckets; each fails the step if it fails.
      - name: Create streams and buckets
        run: |
          docker compose -f infra/docker-compose.yaml run --rm nats-setup
          docker compose -f infra/docker-compose.yaml run --rm minio-setup

      - name: Install dependencies
        working-directory: web
        run: npm ci

      # Also checks the baseline migration on a real, empty database on every change.
      - name: Apply database migrations
        working-directory: web
        run: npx prisma migrate deploy

      - name: Service tests
        working-directory: web
        run: npm run test:service

      - name: Show service logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yaml logs --no-color --tail=100

  engine:
    name: engine (lint, build on PRs)
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Lint
        run: |
          pip install ruff==0.17.3
          ruff check .

      # PRs only: on main the images workflow builds (and pushes) this image anyway.
      # Plain docker build (no buildx builder to boot, no push): checks the image builds.
      - name: Build image
        if: github.event_name == 'pull_request'
        run: docker build -t imgproc-engine:ci .
