name: images

'on':
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - 'engine/**'
      - '.github/workflows/images.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    environment: dockerhub
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for changes
        if: github.event_name == 'push'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            changed:
              - 'web/**'
              - '.github/workflows/images.yml'

      - name: Set up Docker Buildx
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push web image
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: web
          platforms: linux/amd64
          push: true
          tags: |
            socknot1000kg/imgproc-web:${{ github.sha }}
            socknot1000kg/imgproc-web:main
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  engine:
    name: engine
    runs-on: ubuntu-latest
    environment: dockerhub
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for changes
        if: github.event_name == 'push'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            changed:
              - 'engine/**'
              - '.github/workflows/images.yml'

      - name: Set up Docker Buildx
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push engine image
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: engine
          platforms: linux/amd64
          push: true
          tags: |
            socknot1000kg/imgproc-engine:${{ github.sha }}
            socknot1000kg/imgproc-engine:main
          cache-from: type=gha,scope=engine
          cache-to: type=gha,mode=max,scope=engine
