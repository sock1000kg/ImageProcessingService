apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - image-worker.yaml
  - scaledobjects.yaml
  - video-worker.yaml

# The engine image is pinned to a CI build (commit SHA tag). It is several GB, so tracking
# :main made every new CI build trigger a full pull on the lab node at the next KEDA scale-up.
# To upgrade: pick a tag from Docker Hub (socknot1000kg/imgproc-engine) and change newTag.
images:
  - name: socknot1000kg/imgproc-engine
    newTag: 1f4e9f1dbb0a44ab1259ad94ec16058c9f3116d7
