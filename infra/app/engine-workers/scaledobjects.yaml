apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: video-worker
  labels:
    app.kubernetes.io/name: video-worker
    app.kubernetes.io/component: worker
    imgproc.io/pool: video
spec:
  scaleTargetRef:
    name: video-worker
  minReplicaCount: 0
  maxReplicaCount: 1
  pollingInterval: 10
  cooldownPeriod: 120
  triggers:
    - type: nats-jetstream
      metadata:
        # The namespace in the endpoint matches the single app environment (imgproc)
        natsServerMonitoringEndpoint: nats.imgproc.svc.cluster.local:8222
        account: "$G"
        stream: VIDEO_JOBS
        consumer: video-workers
        lagThreshold: "1"
        activationLagThreshold: "0"
        useHttps: "false"
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: image-worker
  labels:
    app.kubernetes.io/name: image-worker
    app.kubernetes.io/component: worker
    imgproc.io/pool: image
spec:
  scaleTargetRef:
    name: image-worker
  minReplicaCount: 0
  maxReplicaCount: 3
  pollingInterval: 10
  cooldownPeriod: 120
  triggers:
    - type: nats-jetstream
      metadata:
        # The namespace in the endpoint matches the single app environment (imgproc)
        natsServerMonitoringEndpoint: nats.imgproc.svc.cluster.local:8222
        account: "$G"
        stream: IMAGE_JOBS
        consumer: image-workers
        lagThreshold: "5"
        activationLagThreshold: "0"
        useHttps: "false"
