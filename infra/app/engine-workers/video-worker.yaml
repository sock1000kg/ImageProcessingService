apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-worker
  labels:
    app.kubernetes.io/name: video-worker
    app.kubernetes.io/component: worker
    imgproc.io/pool: video
spec:
  # Replicas managed by KEDA ScaledObject (min 0, max 1)
  # Queue consumers: stop the old pod before starting the new one on updates. A rolling update
  # would run two engine pods (two YOLO loads) at once; jobs simply wait in NATS meanwhile.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: video-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: video-worker
        app.kubernetes.io/component: worker
        imgproc.io/pool: video
    spec:
      nodeSelector:
        kubernetes.io/hostname: home-server
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: video-worker
          # The tag is pinned in kustomization.yaml (images:); :main here is only the name it overrides.
          image: socknot1000kg/imgproc-engine:main
          imagePullPolicy: IfNotPresent
          env:
            - name: NATS_URL
              value: nats://nats:4222
            - name: NATS_STREAM_NAME
              value: VIDEO_JOBS
            - name: NATS_CONSUMER_NAME
              value: video-workers
            - name: NATS_SUBJECTS
              value: jobs.video
            - name: NATS_EVENTS_SUBJECT
              value: jobs.events
            - name: MINIO_ENDPOINT
              value: minio:9000
            - name: MINIO_SECURE
              value: "false"
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: imgproc-minio
                  key: rootUser
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: imgproc-minio
                  key: rootPassword
            - name: YOLO_CONFIG_DIR
              value: /tmp/Ultralytics
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              cpu: 1500m
              memory: 2048Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
