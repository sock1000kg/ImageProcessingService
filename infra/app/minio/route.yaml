apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: minio-blob
spec:
  hostnames:
    - blob-imgproc.sock1000kg.io.vn
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  rules:
    # Public blob route for presigned S3 URLs.
    # The gateway must pass host and path through unchanged (no path or host rewrite)
    # because the S3 signature covers both the host and path.
    # GET and HEAD only — signed downloads and Range seeks are GET requests with a
    # Range header; nothing in the browser writes to MinIO, preventing write attempts at the gateway.
    - matches:
        - path:
            type: PathPrefix
            value: /
          method: GET
        - path:
            type: PathPrefix
            value: /
          method: HEAD
      backendRefs:
        - name: minio
          port: 9000
