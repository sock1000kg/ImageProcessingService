apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: nats
    repo: https://nats-io.github.io/k8s/helm/charts/
    version: 2.14.6
    releaseName: nats
    valuesFile: values.yaml

configMapGenerator:
  - name: nats-setup-scripts
    files:
      - setup-streams.sh

generatorOptions:
  disableNameSuffixHash: true

resources:
  - setup-job.yaml
