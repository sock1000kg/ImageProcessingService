apiVersion: batch/v1
kind: Job
metadata:
  name: nats-setup
  labels:
    app.kubernetes.io/name: nats-setup
    app.kubernetes.io/part-of: imgproc-setup
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nats-setup
        app.kubernetes.io/part-of: imgproc-setup
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/hostname: home-server
      containers:
        - name: nats-box
          image: natsio/nats-box:0.20.0
          command:
            - /bin/sh
            - /scripts/setup-streams.sh
          env:
            - name: NATS_URL
              value: nats://nats:4222
            - name: WAIT_TIMEOUT_SECONDS
              value: "120"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: nats-setup-scripts
