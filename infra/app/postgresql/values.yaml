# PostgreSQL (Bitnami chart) — Lab-sock tenant.
# Rendered with: kubectl kustomize --enable-helm infra/app
architecture: standalone

global:
  defaultStorageClass: local-path

# Bitnami's Docker Hub `bitnami/postgresql` repo no longer publishes version
# tags (only a rolling `latest`), and `bitnamilegacy/postgresql` stops at 17.x.
# Pin the 18.6.0 image by digest instead so the rendered manifests never carry
# a floating tag. Verified with `docker manifest inspect bitnami/postgresql@sha256:ec38...`.
image:
  registry: docker.io
  repository: bitnami/postgresql
  digest: sha256:ec3840dfcf0caf786877a67d83bc3ebb0c042fd92445c062ec89c51245290942
  pullPolicy: IfNotPresent

auth:
  database: imgproc
  username: imgproc
  # secret imgproc-postgres, keys: postgres-password (admin), password (user)
  existingSecret: imgproc-postgres
  secretKeys:
    adminPasswordKey: postgres-password
    userPasswordKey: password

primary:
  nodeSelector:
    kubernetes.io/hostname: home-server
  persistence:
    enabled: true
    size: 5Gi
    storageClass: local-path
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      # trimmed from the plan's 512Mi to fit the ~2.5Gi steady-state budget
      memory: 384Mi

# The lab's local-path storage dir carries inherited POSIX ACLs whose mask caps
# the group class, so the chart's fsGroup-only fixup cannot create
# /bitnami/postgresql as uid 1001. The init container chowns the data volume to
# 1001:1001 (the owner class is not affected by the ACL mask) instead.
# The image is pinned by digest; `bitnami/os-shell` only carries a rolling
# `latest`, so the versioned image comes from the legacy repo.
# Verified pullable: GET manifest registry-1.docker.io/v2/bitnamilegacy/os-shell/
#   manifests/sha256:77e65e9d633ec1463f8bea185763aa7ef91e5ddbe0b60beb1b0b5d4da58882b6 -> 200
volumePermissions:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/os-shell
    tag: 12-debian-12-r51
    digest: sha256:77e65e9d633ec1463f8bea185763aa7ef91e5ddbe0b60beb1b0b5d4da58882b6
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 32Mi

metrics:
  enabled: true
  image:
    registry: docker.io
    # Bitnami moved versioned images to bitnamilegacy in 2025; `latest` no
    # longer tracks a fixed version, so pin the legacy repo explicitly.
    repository: bitnamilegacy/postgres-exporter
    tag: 0.17.1-debian-12-r16
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 32Mi
  service:
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9187"
