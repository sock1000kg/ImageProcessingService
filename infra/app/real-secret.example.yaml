# Copy to real-secret.yaml (gitignored) and fill in real values, then run
#   infra/seal.sh
# to produce sealed-secret.yaml. Never commit real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: imgproc-minio
  namespace: imgproc
type: Opaque
stringData:
  rootUser: CHANGE_ME_PROD_minio_user
  rootPassword: CHANGE_ME_PROD_minio_password
---
apiVersion: v1
kind: Secret
metadata:
  name: imgproc-postgres
  namespace: imgproc
type: Opaque
stringData:
  postgres-password: CHANGE_ME_PROD_pg_user
  password: CHANGE_ME_PROD_pg_password
---
# Web auth (Phase 2). jwtSecret: at least 32 random characters, e.g. `openssl rand -hex 32`.
# registerKey: the team registration code typed on the sign-up form.
apiVersion: v1
kind: Secret
metadata:
  name: imgproc-web-auth
  namespace: imgproc
type: Opaque
stringData:
  jwtSecret: CHANGE_ME_PROD_jwt_secret_at_least_32_chars
  registerKey: CHANGE_ME_PROD_register_key
