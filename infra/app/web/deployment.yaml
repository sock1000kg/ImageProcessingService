apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/component: web
    spec:
      nodeSelector:
        kubernetes.io/hostname: home-server
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # socknot1000kg/imgproc-web:main is the latest build of main; pods pick it up on restart. Pin a SHA by hand when you need an exact version.
          image: socknot1000kg/imgproc-web:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 500m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          # The container runs `prisma migrate deploy` before the server starts, which is slow on
          # the lab node. Liveness/readiness only begin once the startup probe passes (up to 150s).
          startupProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            - name: PORT
              value: "3000"
            - name: NATS_URL
              value: nats://nats:4222
            - name: MINIO_ENDPOINT
              value: minio
            - name: MINIO_PORT
              value: "9000"
            - name: MINIO_USE_SSL
              value: "false"
            - name: S3_PUBLIC_ENDPOINT
              value: https://blob-imgproc.sock1000kg.io.vn
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: imgproc-minio
                  key: rootUser
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: imgproc-minio
                  key: rootPassword
            # PGPASSWORD must precede DATABASE_URL for $(PGPASSWORD) expansion.
            # Assumes a URL-safe password (seal.sh instructions generate hex).
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: imgproc-postgres
                  key: password
            - name: DATABASE_URL
              value: postgresql://imgproc:$(PGPASSWORD)@postgresql:5432/imgproc
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: imgproc-web-auth
                  key: jwtSecret
            - name: REGISTER_KEY
              valueFrom:
                secretKeyRef:
                  name: imgproc-web-auth
                  key: registerKey
            # The public site is HTTPS only (Cloudflare), so the refresh cookie must be Secure.
            - name: COOKIE_SECURE
              value: "true"
            # Header holding the real client IP: requests arrive through cloudflared + Traefik, and Cloudflare sets it.
            - name: CLIENT_IP_HEADER
              value: cf-connecting-ip
            # Everything below is a tunable that the lab sets explicitly so the deployment is declarative, even where
            # the value equals the web's built-in default.
            # Login lifetime: access token 15 min, refresh token 7 days (seconds).
            - name: JWT_ACCESS_TTL
              value: "900"
            - name: JWT_REFRESH_TTL
              value: "604800"
            # Multipliers on the per-minute rate limits (login/register; batch create, uploads and zip downloads).
            - name: RATE_LIMIT_MULTIPLIER
              value: "1"
            - name: TRANSFER_RATE_LIMIT_MULTIPLIER
              value: "1"
            # Largest accepted photo (50 MB). A photo travels in one request, so this stays under Cloudflare's 100 MB.
            - name: IMAGE_UPLOAD_MAX_BYTES
              value: "52428800"
            # Largest accepted video (200 MB). Videos are sent in chunks, so this is not bound by Cloudflare's limit.
            - name: VIDEO_UPLOAD_MAX_BYTES
              value: "209715200"
            # Size of each video chunk (8 MB): at least 5 MB (S3 minimum), under Cloudflare's 100 MB per request, and
            # VIDEO_UPLOAD_MAX_BYTES / this must stay within S3's 10,000 parts.
            - name: UPLOAD_CHUNK_BYTES
              value: "8388608"
            # Most files in one batch.
            - name: BATCH_MAX_FILES
              value: "1000"
            # Accepted video length in seconds.
            - name: VIDEO_MIN_DURATION_SECONDS
              value: "15"
            - name: VIDEO_MAX_DURATION_SECONDS
              value: "60"
            # ffprobe binary used to check uploaded videos (installed in the web image).
            - name: FFPROBE_BIN
              value: ffprobe
            # Lifetime in seconds of download links: results (1 h) and private originals / allow-list faces (5 min).
            - name: PRESIGN_RESULT_TTL_SECONDS
              value: "3600"
            - name: PRESIGN_PRIVATE_TTL_SECONDS
              value: "300"
            # How often (ms, 10 min) the web deletes expired batches, abandoned drafts and unfinished uploads.
            - name: CLEANUP_INTERVAL_MS
              value: "600000"
            # Days a batch is kept before deletion. Empty = keep until the user deletes it.
            - name: RETENTION_DAYS
              value: ""
      volumes:
        - name: tmp
          emptyDir: {}
