apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
spec:
  hostnames:
    - imgproc.sock1000kg.io.vn
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  rules:
    # Default route for the web application (frontend and API).
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: web
          port: 3000
