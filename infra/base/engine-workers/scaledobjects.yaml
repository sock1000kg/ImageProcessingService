apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ai-worker
  labels:
    app.kubernetes.io/name: ai-worker
    app.kubernetes.io/component: worker
    imgproc.io/pool: ai
spec:
  scaleTargetRef:
    name: ai-worker
  minReplicaCount: 0
  maxReplicaCount: 2
  pollingInterval: 10
  cooldownPeriod: 120
  triggers:
    - type: nats-jetstream
      metadata:
        # The namespace in the endpoint is dev-only by design (engine worker pools are dev-only)
        natsServerMonitoringEndpoint: nats.imgproc-dev.svc.cluster.local:8222
        account: "$G"
        stream: AI_JOBS
        consumer: ai-workers
        lagThreshold: "1"
        activationLagThreshold: "0"
        useHttps: "false"
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: image-worker
  labels:
    app.kubernetes.io/name: image-worker
    app.kubernetes.io/component: worker
    imgproc.io/pool: image
spec:
  scaleTargetRef:
    name: image-worker
  minReplicaCount: 0
  maxReplicaCount: 3
  pollingInterval: 10
  cooldownPeriod: 120
  triggers:
    - type: nats-jetstream
      metadata:
        # The namespace in the endpoint is dev-only by design (engine worker pools are dev-only)
        natsServerMonitoringEndpoint: nats.imgproc-dev.svc.cluster.local:8222
        account: "$G"
        stream: IMAGE_JOBS
        consumer: image-workers
        lagThreshold: "5"
        activationLagThreshold: "0"
        useHttps: "false"
