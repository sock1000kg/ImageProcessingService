apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: minio-results
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  rules:
    # same-origin delivery of finished results: /results/<key> is passed through
    # untouched, so MinIO serves bucket `results` path-style.
    # GET and HEAD only — the anonymous policy on the bucket is GetObject, so any
    # other method would fail anyway; refusing it at the Gateway keeps an
    # unmaintained object store from ever seeing a write attempt.
    - matches:
        - path:
            type: PathPrefix
            value: /results/
          method: GET
        - path:
            type: PathPrefix
            value: /results/
          method: HEAD
      backendRefs:
        - name: minio
          port: 9000