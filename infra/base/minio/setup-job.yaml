apiVersion: batch/v1
kind: Job
metadata:
  name: minio-setup
  labels:
    app.kubernetes.io/name: minio-setup
    app.kubernetes.io/part-of: imgproc-setup
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-setup
        app.kubernetes.io/part-of: imgproc-setup
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/hostname: home-server
      containers:
        - name: mc
          image: socknot1000kg/minio:RELEASE.2025-10-15T17-29-55Z
          command:
            - /bin/sh
            - /scripts/setup-buckets.sh
          env:
            - name: MINIO_URL
              value: http://minio:9000
            - name: WAIT_TIMEOUT_SECONDS
              value: "120"
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: imgproc-minio
                  key: rootUser
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: imgproc-minio
                  key: rootPassword
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: minio-setup-scripts
