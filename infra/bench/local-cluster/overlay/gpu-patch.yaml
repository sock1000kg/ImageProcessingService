apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-worker
  namespace: imgproc
spec:
  template:
    spec:
      runtimeClassName: nvidia
      containers:
        - name: image-worker
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "compute,utility"
