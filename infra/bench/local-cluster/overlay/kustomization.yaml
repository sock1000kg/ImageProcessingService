apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../app

patches:
  # Delete SealedSecrets (lab encryption key cannot be used locally; up.sh creates random secrets)
  - patch: |-
      apiVersion: bitnami.com/v1alpha1
      kind: SealedSecret
      metadata:
        name: imgproc-minio
        namespace: imgproc
      $patch: delete
    target:
      kind: SealedSecret
      name: imgproc-minio
  - patch: |-
      apiVersion: bitnami.com/v1alpha1
      kind: SealedSecret
      metadata:
        name: imgproc-postgres
        namespace: imgproc
      $patch: delete
    target:
      kind: SealedSecret
      name: imgproc-postgres
  - patch: |-
      apiVersion: bitnami.com/v1alpha1
      kind: SealedSecret
      metadata:
        name: imgproc-web-auth
        namespace: imgproc
      $patch: delete
    target:
      kind: SealedSecret
      name: imgproc-web-auth

  # Delete HTTPRoutes (lab gateway routes)
  - patch: |-
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: minio-results
        namespace: imgproc
      $patch: delete
    target:
      kind: HTTPRoute
      name: minio-results
  - patch: |-
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: web
        namespace: imgproc
      $patch: delete
    target:
      kind: HTTPRoute
      name: web

  # Web: the benchmark uploads thousands of images as fast as it can, so lift the per-account rate limits, and run the
  # locally built image (build-web.sh: the working tree's web/, imported into k3s) instead of pulling :main.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: web
        namespace: imgproc
      spec:
        template:
          spec:
            containers:
              - name: web
                image: imgproc-web:bench
                imagePullPolicy: Never
                env:
                  - name: TRANSFER_RATE_LIMIT_MULTIPLIER
                    value: "100"
    target:
      kind: Deployment
      name: web

  # Remove nodeSelector: kubernetes.io/hostname: home-server
  - patch: |-
      - op: remove
        path: /spec/template/spec/nodeSelector
    target:
      kind: Deployment
      name: image-worker
  - patch: |-
      - op: remove
        path: /spec/template/spec/nodeSelector
    target:
      kind: Deployment
      name: minio
  - patch: |-
      - op: remove
        path: /spec/template/spec/nodeSelector
    target:
      kind: Deployment
      name: video-worker
  - patch: |-
      - op: remove
        path: /spec/template/spec/nodeSelector
    target:
      kind: Deployment
      name: web
  - patch: |-
      - op: remove
        path: /spec/template/spec/nodeSelector
    target:
      kind: StatefulSet
      name: nats
  - patch: |-
      - op: remove
        path: /spec/template/spec/nodeSelector
    target:
      kind: StatefulSet
      name: postgresql
  - patch: |-
      - op: remove
        path: /spec/template/spec/nodeSelector
    target:
      kind: Job
      name: minio-setup
  - patch: |-
      - op: remove
        path: /spec/template/spec/nodeSelector
    target:
      kind: Job
      name: nats-setup

  # GPU mode patch for image-worker (default: GPU mode)
  - path: gpu-patch.yaml

  # engine/models mounted read-only over image-worker's /app/models, for run.sh --model (up.sh fills in the path)
  - path: models-mount-patch.yaml
