apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml

helmCharts:
  - name: keda
    repo: https://kedacore.github.io/charts
    version: 2.20.2
    releaseName: keda
    # the release namespace, set on the chart instead of top-level `namespace:`
    # a top-level namespace transformer also rewrites the chart's intentional
    # kube-system resources (RoleBinding/keda-operator-auth-reader) into keda,
    # which breaks the metrics apiserver's configmap reader
    namespace: keda
    valuesFile: values.yaml

# CRDs are large: deploy.sh applies this overlay with --server-side
