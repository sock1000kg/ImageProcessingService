# Local parity environment for teammates (no Kubernetes needed).
#
#   cp infra/.env.example infra/.env     # then edit if you like
#   docker compose -f infra/docker-compose.yaml up -d                            # services: NATS, Postgres, MinIO
#   docker compose -f infra/docker-compose.yaml --profile app up -d --build      # + web (http://localhost:3000) and
#                                                                                #   both Engine workers, built from here
#   (the app profile also needs --profile app on stop/down/logs; run web or the Engine from source without it)
#   docker compose -f infra/docker-compose.yaml run --rm nats-setup    # idempotent re-run
#   docker compose -f infra/docker-compose.yaml run --rm minio-setup
#   docker compose -f infra/docker-compose.yaml down -v
#
# The setup services run exactly the same scripts as the Kubernetes Jobs
# (infra/app/nats/setup-streams.sh, infra/app/minio/setup-buckets.sh).
name: imgproc-local

services:
  nats:
    image: nats:2.14.6-alpine
    command: ["-js", "-m", "8222", "-sd", "/data"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  nats-setup:
    image: natsio/nats-box:0.20.0
    depends_on:
      nats:
        condition: service_healthy
    environment:
      NATS_URL: nats://nats:4222
      WAIT_TIMEOUT_SECONDS: "120"
    volumes:
      - ./app/nats/setup-streams.sh:/scripts/setup-streams.sh:ro
    entrypoint: ["/bin/sh", "/scripts/setup-streams.sh"]
    restart: "no"

  postgres:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_DB: imgproc
      POSTGRES_USER: imgproc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
    ports:
      - "5432:5432"
    volumes:
      # postgres:18 stores its data under /var/lib/postgresql/<major>
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imgproc -d imgproc"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: socknot1000kg/minio:RELEASE.2025-10-15T17-29-55Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in infra/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in infra/.env}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-setup:
    image: socknot1000kg/minio:RELEASE.2025-10-15T17-29-55Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_URL: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in infra/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in infra/.env}
      WAIT_TIMEOUT_SECONDS: "120"
    volumes:
      - ./app/minio/setup-buckets.sh:/scripts/setup-buckets.sh:ro
    entrypoint: ["/bin/sh", "/scripts/setup-buckets.sh"]
    restart: "no"

  # --- the application: same images and settings as the lab (infra/app/web, infra/app/engine-workers) ---
  web:
    profiles: [app]
    build: ../web
    image: imgproc-web:local
    depends_on:
      postgres:
        condition: service_healthy
      nats-setup:
        condition: service_completed_successfully
      minio-setup:
        condition: service_completed_successfully
    environment:
      PORT: "3000"
      DATABASE_URL: postgresql://imgproc:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}@postgres:5432/imgproc
      NATS_URL: nats://nats:4222
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in infra/.env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in infra/.env}
      # presigned URLs are opened by the browser, so they point at the host port, not the compose network
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      # signs login tokens; this default is for a local machine only (set JWT_SECRET in infra/.env to change it)
      JWT_SECRET: ${JWT_SECRET:-local-only-jwt-secret-not-for-deployment-0000}
      COOKIE_SECURE: "false"  # plain http on localhost
      # the sign-up page asks for this key; without one registration is disabled (set REGISTER_KEY in infra/.env)
      REGISTER_KEY: ${REGISTER_KEY:-local}
    ports:
      - "3000:3000"
    restart: unless-stopped

  image-worker: &engine-worker
    profiles: [app]
    build: ../engine
    image: imgproc-engine:local
    depends_on:
      nats-setup:
        condition: service_completed_successfully
      minio-setup:
        condition: service_completed_successfully
    environment: &engine-env
      NATS_URL: nats://nats:4222
      NATS_STREAM_NAME: IMAGE_JOBS
      NATS_CONSUMER_NAME: image-workers
      NATS_SUBJECTS: jobs.image
      NATS_EVENTS_SUBJECT: jobs.events
      MINIO_ENDPOINT: minio:9000
      MINIO_SECURE: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in infra/.env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in infra/.env}
      YOLO_CONFIG_DIR: /tmp/Ultralytics
      HOME: /tmp
    restart: unless-stopped

  video-worker:
    <<: *engine-worker
    environment:
      <<: *engine-env
      NATS_STREAM_NAME: VIDEO_JOBS
      NATS_CONSUMER_NAME: video-workers
      NATS_SUBJECTS: jobs.video

volumes:
  nats-data:
  postgres-data:
  minio-data:
