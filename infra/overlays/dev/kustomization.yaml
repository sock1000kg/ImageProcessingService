apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# dev overlay — everything lands in imgproc-dev
namespace: imgproc-dev

resources:
  - namespace.yaml
  - ../../base
  - ../../base/engine-workers
  - sealed-secret.yaml

# prod-grade sizing is not needed for dev: keep the smaller base values
patches:
  - path: patch-results-route.yaml
