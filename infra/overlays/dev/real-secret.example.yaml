# Copy to real-secret.yaml (gitignored) and fill in real values, then run
#   infra/seal.sh dev
# to produce sealed-secret.yaml. Never commit real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: imgproc-minio
  namespace: imgproc-dev
type: Opaque
stringData:
  rootUser: CHANGE_ME_DEV_minio_user
  rootPassword: CHANGE_ME_DEV_minio_password
---
apiVersion: v1
kind: Secret
metadata:
  name: imgproc-postgres
  namespace: imgproc-dev
type: Opaque
stringData:
  postgres-password: CHANGE_ME_DEV_pg_user
  password: CHANGE_ME_DEV_pg_password
