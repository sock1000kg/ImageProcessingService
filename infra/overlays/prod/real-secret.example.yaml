# Copy to real-secret.yaml (gitignored) and fill in real values, then run
#   infra/seal.sh prod
# to produce sealed-secret.yaml. Never commit real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: imgproc-minio
  namespace: imgproc-prod
type: Opaque
stringData:
  rootUser: CHANGE_ME_PROD_minio_user
  rootPassword: CHANGE_ME_PROD_minio_password
---
apiVersion: v1
kind: Secret
metadata:
  name: imgproc-postgres
  namespace: imgproc-prod
type: Opaque
stringData:
  postgres-password: CHANGE_ME_PROD_pg_user
  password: CHANGE_ME_PROD_pg_password
